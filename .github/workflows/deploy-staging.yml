name: Deploy Staging

# Merges to main deploy heirloom-staging.storywriter.net (matching the
# frontend/backend release scheme).
#
# Model: Next.js `standalone` build shipped to a t4g.micro EC2 instance over SSH
# (replaces the old static export -> S3 sync -> CloudFront invalidation).
# Terraform still manages the instance; the app is built in CI and rsync'd to a
# timestamped release dir, then the `current` symlink is flipped and the systemd
# service restarted.
#
# Required in the repo's `staging` GitHub environment:
#   - secret AWS_ROLE_ARN      (OIDC role for the Terraform job; state + provisioning)
#   - secret SSH_PRIVATE_KEY   (private half of the deploy keypair on the instance)
#   - var    NEXT_PUBLIC_API_URL (optional; defaults to the staging API below)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time: queued runs wait instead of racing a deploy in flight.
concurrency:
  group: deploy-heirloom-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  AWS_REGION: us-east-1
  TERRAFORM_DIR: terraform/heirloom-staging
  APP_NAME: heirloom-staging

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  infrastructure:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      host: ${{ steps.terraform.outputs.elastic_ip }}
      domain: ${{ steps.terraform.outputs.domain_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init

      - name: Terraform Plan / Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          EXIT_CODE=0
          terraform plan -detailed-exitcode -out=tfplan || EXIT_CODE=$?

          case $EXIT_CODE in
            0)
              echo "✅ Infrastructure is up to date - no changes needed"
              ;;
            2)
              echo "⚠️  Infrastructure changes detected (first run or drift)"
              terraform apply -auto-approve tfplan
              echo "✅ Infrastructure applied"
              ;;
            *)
              echo "❌ Terraform plan failed (exit code $EXIT_CODE)"
              exit 1
              ;;
          esac

      - name: Extract Terraform Outputs
        id: terraform
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          echo "elastic_ip=$(terraform output -raw elastic_ip)" >> $GITHUB_OUTPUT
          echo "domain_name=$(terraform output -raw domain_name)" >> $GITHUB_OUTPUT

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        env:
          # Baked in at build time; staging builds always target the staging API
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://staging-api.storywriter.net/api' }}
        run: |
          echo "Building with NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL"
          npm run build

      - name: Assemble standalone bundle
        run: |
          # server.js only serves public/ and .next/static if they sit alongside it.
          if [ -d public ]; then cp -r public .next/standalone/; fi
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

          if [ ! -f .next/standalone/server.js ]; then
            echo "❌ Build failed: .next/standalone/server.js not found (is output:'standalone' set?)"
            exit 1
          fi
          echo "✅ Standalone bundle assembled"

      - name: Create deployment artifact
        run: tar -czf heirloom-${{ github.sha }}.tar.gz -C .next/standalone .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: heirloom-build-staging
          path: heirloom-${{ github.sha }}.tar.gz
          retention-days: 7

  deploy:
    needs: [infrastructure, build]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v7
        with:
          name: heirloom-build-staging

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ needs.infrastructure.outputs.host }} >> ~/.ssh/known_hosts

      - name: Copy artifact to server
        run: |
          scp -i ~/.ssh/deploy_key heirloom-${{ github.sha }}.tar.gz \
            deploy@${{ needs.infrastructure.outputs.host }}:/tmp/heirloom.tar.gz

      - name: Extract, activate, restart
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ needs.infrastructure.outputs.host }} \
            APP_NAME='${{ env.APP_NAME }}' SHA='${{ github.sha }}' 'bash -s' << 'DEPLOY_SCRIPT'
          set -e

          APP_DIR="/var/www/${APP_NAME}"
          RELEASE_DIR="${APP_DIR}/releases/${SHA}"

          echo "==> Unpacking release ${SHA}..."
          rm -rf "${RELEASE_DIR}"
          mkdir -p "${RELEASE_DIR}"
          tar -xzf /tmp/heirloom.tar.gz -C "${RELEASE_DIR}"
          rm -f /tmp/heirloom.tar.gz

          echo "==> Flipping current symlink..."
          ln -sfn "${RELEASE_DIR}" "${APP_DIR}/current"
          sudo chown -R deploy:www-data "${APP_DIR}/releases/${SHA}"

          echo "==> Restarting service..."
          sudo systemctl restart "${APP_NAME}"

          echo "==> Pruning old releases (keep last 5)..."
          cd "${APP_DIR}/releases"
          ls -t | tail -n +6 | xargs -r rm -rf

          echo "==> Deployed ${SHA}"
          DEPLOY_SCRIPT

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  verify-deployment:
    needs: [infrastructure, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment
        run: |
          DOMAIN=${{ needs.infrastructure.outputs.domain }}
          echo "Verifying deployment at https://${DOMAIN}"

          # Give the service a moment to come up after restart
          sleep 5

          for path in "/" "/login"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://${DOMAIN}${path}" || echo "000")
            if [[ "$CODE" =~ ^(200|301|302|307)$ ]]; then
              echo "✅ https://${DOMAIN}${path} -> $CODE"
            else
              echo "❌ https://${DOMAIN}${path} -> $CODE"
              exit 1
            fi
          done
