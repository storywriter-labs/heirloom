name: Deploy Staging

# Merges to main deploy the staging host (matching the frontend/backend release
# scheme).
#
# Model: Next.js `standalone` build shipped to a t4g.micro EC2 instance over SSH
# (replaces the old static export -> S3 sync -> CloudFront invalidation).
#
# Infrastructure is NOT managed here — the instance is provisioned manually with
# Terraform (see terraform/environments/staging/README.md), the same way the backend
# does it. CI only builds the app and ships it to the running box.
#
# Required in the repo's `staging` GitHub environment:
#   - secret STAGING_HOST      (instance public host: the staging domain or its EIP)
#   - secret SSH_PRIVATE_KEY   (private half of the deploy keypair on the instance)
#   - secret AWS_DEPLOY_ROLE_ARN      (terraform output github_deploy_role_arn)
#   - secret DEPLOY_SECURITY_GROUP_ID (terraform output security_group_id)
#   - var    NEXT_PUBLIC_API_URL (optional; defaults to the staging API below)
#
# Port 22 on the box is shut to everyone but the addresses in `allowed_ssh_cidrs`
# (terraform/modules/heirloom-server). A runner's address is not one of them, so
# the deploy job opens the port for its own /32 and shuts it again — that is what
# the last two secrets are for. While either is unset the job skips those steps
# and deploys exactly as it did before, so this workflow can merge ahead of the
# Terraform apply. Once port 22 is actually locked down, a deploy without the
# secrets can no longer connect.
#
# STAGING_HOST is deliberately a secret, so Actions masks it to `***` in logs and the
# staging domain stays out of public run output. Access to the box is expected to be
# restricted later; keep it a secret even while the host still answers publicly.
# Because it is masked, the steps below assert it is non-empty rather than relying on
# reading it back from the log.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# One deploy at a time: queued runs wait instead of racing a deploy in flight.
concurrency:
  group: deploy-heirloom-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  APP_NAME: heirloom-staging
  AWS_REGION: us-east-1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        env:
          # Baked in at build time; staging builds always target the staging API
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://staging-api.storywriter.net/api' }}
        run: |
          echo "Building with NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL"
          npm run build

      - name: Assemble standalone bundle
        run: |
          # server.js only serves public/ and .next/static if they sit alongside it.
          if [ -d public ]; then cp -r public .next/standalone/; fi
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

          if [ ! -f .next/standalone/server.js ]; then
            echo "❌ Build failed: .next/standalone/server.js not found (is output:'standalone' set?)"
            exit 1
          fi
          echo "✅ Standalone bundle assembled"

      - name: Create deployment artifact
        run: tar -czf heirloom-${{ github.sha }}.tar.gz -C .next/standalone .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: heirloom-build-staging
          path: heirloom-${{ github.sha }}.tar.gz
          retention-days: 7

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment: staging

    # id-token: write is what lets the job exchange its OIDC token for the
    # deploy role. The other two are the defaults this block would otherwise
    # take away; the job still needs them to pull the build artifact.
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v7
        with:
          name: heirloom-build-staging

      - name: Check just-in-time SSH access is configured
        id: jit
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          SG_ID: ${{ secrets.DEPLOY_SECURITY_GROUP_ID }}
        run: |
          if [ -n "${ROLE_ARN}" ] && [ -n "${SG_ID}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ Will open port 22 for this runner only"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_DEPLOY_ROLE_ARN / DEPLOY_SECURITY_GROUP_ID are not set on the staging environment — this deploy needs port 22 to already allow the runner."
          fi

      - name: Configure AWS credentials
        if: steps.jit.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-heirloom-staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Open SSH access for this runner
        id: open-ssh
        if: steps.jit.outputs.enabled == 'true'
        env:
          SG_ID: ${{ secrets.DEPLOY_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -fsS --retry 3 --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')
          if ! printf '%s' "${RUNNER_IP}" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
            echo "::error::Could not read this runner's public IPv4 address"
            exit 1
          fi

          # Record the CIDR before opening, not after: if authorize fails halfway
          # the close step below still knows what to revoke.
          echo "cidr=${RUNNER_IP}/32" >> "$GITHUB_OUTPUT"

          aws ec2 authorize-security-group-ingress \
            --group-id "${SG_ID}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='github-actions deploy run ${{ github.run_id }}'}]"

          echo "✅ Port 22 open for this runner"

      - name: Setup SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -z "${STAGING_HOST}" ]; then
            echo "❌ STAGING_HOST is empty — refusing to deploy to an unknown host"
            exit 1
          fi
          echo "✅ STAGING_HOST is set (value masked in logs)"

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${STAGING_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy artifact to server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key heirloom-${{ github.sha }}.tar.gz \
            "deploy@${STAGING_HOST}:/tmp/heirloom.tar.gz"

      - name: Extract, activate, restart
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@${STAGING_HOST}" \
            APP_NAME='${{ env.APP_NAME }}' SHA='${{ github.sha }}' 'bash -s' << 'DEPLOY_SCRIPT'
          set -e

          APP_DIR="/var/www/${APP_NAME}"
          RELEASE_DIR="${APP_DIR}/releases/${SHA}"

          echo "==> Unpacking release ${SHA}..."
          rm -rf "${RELEASE_DIR}"
          mkdir -p "${RELEASE_DIR}"
          tar -xzf /tmp/heirloom.tar.gz -C "${RELEASE_DIR}"
          rm -f /tmp/heirloom.tar.gz

          echo "==> Flipping current symlink..."
          ln -sfn "${RELEASE_DIR}" "${APP_DIR}/current"
          sudo chown -R deploy:www-data "${APP_DIR}/releases/${SHA}"

          echo "==> Restarting service..."
          sudo systemctl restart "${APP_NAME}"

          echo "==> Pruning old releases (keep last 5)..."
          cd "${APP_DIR}/releases"
          ls -t | tail -n +6 | xargs -r rm -rf

          echo "==> Deployed ${SHA}"
          DEPLOY_SCRIPT

      # Runs even when the deploy failed or was cancelled: a run that ends with
      # the port still open is worse than a run that failed.
      - name: Close SSH access
        if: always() && steps.open-ssh.outputs.cidr != ''
        env:
          SG_ID: ${{ secrets.DEPLOY_SECURITY_GROUP_ID }}
          CIDR: ${{ steps.open-ssh.outputs.cidr }}
        run: |
          if aws ec2 revoke-security-group-ingress \
               --group-id "${SG_ID}" --protocol tcp --port 22 --cidr "${CIDR}" 2>/tmp/revoke.err; then
            echo "✅ Port 22 closed again"
          elif grep -q "InvalidPermission.NotFound" /tmp/revoke.err; then
            echo "✅ Port 22 was already closed"
          else
            cat /tmp/revoke.err
            echo "::error::Could not close port 22 for ${CIDR} — revoke that rule on ${SG_ID} by hand."
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  verify-deployment:
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify deployment
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -z "${STAGING_HOST}" ]; then
            echo "❌ STAGING_HOST is empty — nothing to verify"
            exit 1
          fi

          # `/` is still the stock create-next-app template, so a 200 there proves
          # nothing about the app. `/login` is the real entry point — it is the route
          # that shows the app actually rendered and was served by our build.
          PATH_TO_CHECK="/login"
          echo "Verifying deployment at ${PATH_TO_CHECK} (host masked in logs)"

          # Give the service a moment to come up after restart
          sleep 5

          CODE=$(curl -s -o /tmp/verify.html -w "%{http_code}" -m 10 \
            "https://${STAGING_HOST}${PATH_TO_CHECK}" || echo "000")

          if [ "$CODE" != "200" ]; then
            echo "❌ ${PATH_TO_CHECK} -> $CODE (expected 200)"
            exit 1
          fi
          echo "✅ ${PATH_TO_CHECK} -> $CODE"

          # A 200 can still be an error shell or a stale page — confirm the login UI
          # itself is in the response body.
          if ! grep -qi "Heirloom" /tmp/verify.html; then
            echo "❌ ${PATH_TO_CHECK} returned 200 but the body does not look like the Heirloom login page"
            exit 1
          fi
          echo "✅ ${PATH_TO_CHECK} body contains the Heirloom login page"
